spring.application.name=life-khmer-api

server.port=8090

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lifekhmer}
spring.datasource.username=${DB_USERNAME:lifekhmer}
spring.datasource.password=${DB_PASSWORD:lifekhmer}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_EXPIRATION:900000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN:2592000000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://10.0.2.2:8090}
app.upload.max-image-size-bytes=${UPLOAD_MAX_IMAGE_SIZE_BYTES:5242880}
